<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ContextTest experiment report</title>
  <desc id="desc">An editorial report showing a candidate instruction file leading a baseline by 67 percentage points in task success.</desc>
  <rect width="1200" height="630" fill="#f7f8fb"/>
  <g transform="translate(66 52)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#101828" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="4">CONTEXTTEST</text>
    <text x="1068" y="0" text-anchor="end" dominant-baseline="hanging" fill="#667085" font-family="ui-monospace, monospace" font-size="11">EXPERIMENT / 05</text>
    <path d="M0 35H1068" stroke="#101828" stroke-width="1"/>
    <text x="0" y="79" fill="#174ea6" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2">INSTRUCTION EXPERIMENT / PAYMENTS-API</text>
    <text x="0" y="132" fill="#101828" font-family="Georgia, serif" font-size="70" letter-spacing="-3">Measure the</text>
    <text x="0" y="205" fill="#174ea6" font-family="Georgia, serif" font-size="70" font-style="italic" letter-spacing="-3">instructions,</text>
    <text x="380" y="205" fill="#101828" font-family="Georgia, serif" font-size="70" letter-spacing="-3">not the intuition.</text>
    <path d="M0 280H1068" stroke="#d8dee9"/>
    <text x="0" y="314" fill="#667085" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1.5">MEASURED OUTCOME</text>
    <text x="778" y="314" text-anchor="end" fill="#667085" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1">WITHOUT</text>
    <text x="1038" y="314" text-anchor="end" fill="#667085" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1">WITH</text>
    <rect x="810" y="336" width="258" height="174" fill="#e2f6ef"/>
    <g fill="#667085" font-family="Arial, sans-serif" font-size="15" font-weight="600">
      <text x="0" y="370">Task success</text><text x="0" y="424">Assertion adherence</text><text x="0" y="478">Median changed files</text>
    </g>
    <g fill="#667085" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="end">
      <text x="778" y="370">33%</text><text x="778" y="424">71%</text><text x="778" y="478">9</text>
    </g>
    <g fill="#08775c" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="end">
      <text x="1038" y="370">100%</text><text x="1038" y="424">96%</text><text x="1038" y="478">4</text>
    </g>
    <g stroke="#d8dee9"><path d="M0 336H1068"/><path d="M0 390H1068"/><path d="M0 444H1068"/><path d="M0 510H1068"/></g>
    <path d="M0 545H1068" stroke="#101828"/>
    <text x="0" y="580" fill="#08775c" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1.5">CANDIDATE LEADS · DIRECTIONAL SIGNAL · 5 PAIRED RUNS</text>
  </g>
