name: Release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --ignore-scripts
      - run: npm run check
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: Explain skipped npm publish
        if: env.NPM_TOKEN == ''
        run: echo "::notice title=npm publish skipped::Add the NPM_TOKEN repository secret to publish future releases."
