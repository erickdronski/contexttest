name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run demo
        if: matrix.node == 20
      - run: npm run demo:ablate
        if: matrix.node == 20
      - run: npm run smoke:install
        if: matrix.node == 20
      - uses: actions/upload-artifact@v7
        if: matrix.node == 20
        with:
          name: deterministic-demo-report
          path: .contexttest/reports/

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./
        id: contexttest
        with:
          config: examples/calculator/contexttest.json
          attempts: 1
          report-dir: action-report
      - name: Verify action outputs
        env:
          WINNER: ${{ steps.contexttest.outputs.winner }}
          REPORT_JSON: ${{ steps.contexttest.outputs.report-json }}
          REPORT_HTML: ${{ steps.contexttest.outputs.report-html }}
        run: test "$WINNER" = candidate && test -f "$REPORT_JSON" && test -f "$REPORT_HTML"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: action-smoke-report
          path: action-report/
