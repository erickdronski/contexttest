name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run demo
        if: matrix.node == 20
      - uses: actions/upload-artifact@v4
        if: matrix.node == 20
        with:
          name: deterministic-demo-report
          path: .contexttest/reports/
