name: Bug report
description: Report a reproducible ContextTest defect.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private prompts, proprietary source code, or unredacted reports.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest public repository or steps that reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ContextTest version
      placeholder: 0.3.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node 22, Git 2.49, Codex CLI
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and private data.
          required: true
